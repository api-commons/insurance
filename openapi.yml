          description: OK
          content:
            application/json:
              schema:
                type: array
                items: *id003
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
  /claims/{claim_id}:
    parameters:
    - $ref: '#/components/parameters/claim_id'
    get:
      operationId: getClaim
      summary: Get a claim
      tags:
