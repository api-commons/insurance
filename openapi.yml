    Claim:
      $ref: ./schema/claim.json
    Policyholder:
      $ref: ./schema/policyholder.json
    InsuranceProduct:
      $ref: ./schema/insurance_product.json
  parameters:
    policy_id:
      name: policy_id
      in: path
      required: true
      schema:
        type: string
    quote_id:
      name: quote_id
      in: path
      required: true
      schema:
        type: string
    claim_id:
      name: claim_id
      in: path
      required: true
