openapi: 3.1.0
info:
  title: Insurance (API Commons)
  version: 0.1.0-draft.20261110
  description: 'The common Insurance interface, distilled from the harvested OpenAPI of 143 providers in the APIs.io
    catalog. Not a product: no one serves this API. It is the shape the market already shares, measured, so that
    providers, agents and integrators can map to one vocabulary. See profile.yml.'
  license:
    name: CC BY-NC-SA 4.0
    url: https://creativecommons.org/licenses/by-nc-sa/4.0/
paths:
  /policies/{policy_id}:
    parameters:
    - $ref: '#/components/parameters/policy_id'
    get:
      operationId: getPolicy
      summary: Get a policy
      tags:
      - Policies
      x-commons-tier: core
      x-commons-share: 0.667
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: &id001
                $ref: '#/components/schemas/Policy'
    patch:
      operationId: updatePolicy
      summary: Update a policy
      tags:
      - Policies
      x-commons-tier: extended
      x-commons-share: 0.3
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema: *id001
  /policies:
    get:
      operationId: listPolicies
      summary: List policies
      tags:
      - Policies
      x-commons-tier: core
      x-commons-share: 0.6
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: *id001
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
    post:
      operationId: createPolicy
      summary: Create a policy
      tags:
      - Policies
      x-commons-tier: core
      x-commons-share: 0.567
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema: *id001
  /quotes:
