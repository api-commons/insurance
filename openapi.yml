      operationId: createQuote
      summary: Create a quote
      tags:
      - Quotes
      x-commons-tier: core
      x-commons-share: 0.882
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: &id002
                $ref: '#/components/schemas/Quote'
      requestBody:
        required: true
        content:
          application/json:
            schema: *id002
    get:
      operationId: listQuotes
      summary: List quotes
      tags:
      - Quotes
      x-commons-tier: extended
      x-commons-share: 0.235
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: *id002
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
  /quotes/{quote_id}:
    parameters:
    - $ref: '#/components/parameters/quote_id'
    get:
      operationId: getQuote
      summary: Get a quote
      tags:
      - Quotes
      x-commons-tier: extended
      x-commons-share: 0.471
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id002
    patch:
      operationId: updateQuote
      summary: Update a quote
      tags:
      - Quotes
      x-commons-tier: extended
      x-commons-share: 0.206
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema: *id002
  /claims:
    post:
      operationId: createClaim
      summary: Create a claim
      tags:
      - Claims
      x-commons-tier: core
