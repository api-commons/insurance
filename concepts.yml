context: insurance
name: Insurance
intro: >-
  The common insurance vocabulary -- the quotes a customer is given, the policies they buy,
  the coverages in them, the people insured and the claims they make -- distilled from the
  APIs that already exist. Health insurance belongs to the healthcare context.
tags: [Insurance, Insurtech, Property and Casualty, Life Insurance, Embedded Insurance, Claims, Underwriting, Auto Insurance]

envelope: [_links, _pagination, _results, data, success, errors, warnings, count, total, page, meta, links,
           value, results, next, previous, has_more, message, status_code, ids, next_page, previous_page,
           page_info, cursor, total_count, per_page, total_pages, current_page, object, url]

common_fields:
  id: [uuid, guid, object_id, record_id, remote_id, policy_id, quote_id, claim_id]
  created_at: [created, created_date, date_created, create_time, creation_date, created_on]
  updated_at: [updated, updated_date, modified_at, last_modified, date_modified, update_time, modified_date, modified]
  metadata: [meta_data, custom_fields, custom, attributes, properties, additional_data]
  status: [state, policy_status, quote_status, claim_status]
  currency: [currency_code, iso_currency_code]
  premium: [premium_amount, total_premium, annual_premium, monthly_premium, price, gross_premium, amount]
  product_id: [product, product_code, product_name, line_of_business, plan_id, plan]
  policyholder_id: [policyholder, customer_id, customer, insured_id, insured, holder_id, client_id, account_id, person_id]
  effective_date: [start_date, inception_date, effective_from, starts_at, coverage_start_date, effective_at]
  expiration_date: [end_date, expiry_date, expires_at, effective_to, coverage_end_date, expiry]

concepts:
  policy:
    segments: [policies, policy, insurance_policies, contracts@insurance|policies]
    aliases:
      number: [policy_number, policy_no, reference, policy_reference]
      coverages: [coverage, covers, benefits, coverage_options, coverage_items]
      insured_items: [risks, vehicles, properties, insured_objects, assets]
      renewal_date: [renews_at, next_renewal_date]
      cancelled_at: [cancellation_date, canceled_at, cancelled_date]
  quote:
    segments: [quotes, quote, quotations, quotation, applications@insurance|policies, offers@insurance]
    aliases:
      number: [quote_number, reference]
      coverages: [coverage, covers, coverage_options, coverage_summary]
      expires_at: [expiration_date, valid_until, expiry]
      bound_at: [bound, accepted_at, converted_at]
  claim:
    segments: [claims, claim, fnol, first_notice_of_loss, losses]
    aliases:
      number: [claim_number, claim_no, reference]
      policy_id: [policy, policy_number]
      loss_date: [incident_date, date_of_loss, occurred_at, loss_occurred_at, event_date]
      reported_at: [reported_date, submitted_at, notified_at, fnol_date]
      claimed_amount: [amount, claim_amount, reserve, amount_claimed, total_claimed]
      paid_amount: [amount_paid, settlement_amount, payout_amount]
      description: [loss_description, incident_description, notes]
      type: [claim_type, loss_type, peril, cause_of_loss]
  # policyholder was measured and dropped: 2 providers expose insureds as a resource.
  # coverage was measured and dropped: 2 providers expose coverages as a resource; the
  # rest carry them on the policy and the quote.
  insurance_product:
    requires: [policy]
    segments: [products, product, insurance_products, insurance-products, lines_of_business]
    aliases:
      name: [title, product_name, display_name]
      type: [product_type, line_of_business, category]

duplicates:
  solera: [audatex]
  oper: [oper-credits]
  orbii: [orbii-tech-ltd]
  thatch: [thatch-health]

findings:
  - "A claim agrees on more than any other insurance resource: number, status, the policy,
    the loss date and a description are all core."
  - "A policy agrees on its number, status and effective and expiration dates; what it covers
    is modelled too differently to share."
  - "A quote agrees only on id and premium, with status just under (48%): embedded-insurance
    APIs quote by product and carriers quote by risk, and the request shapes diverge."
  - "Coverages live on the policy and the quote, not as resources (2 providers)."
decisions:
  - "Health insurance is the healthcare context's: payers, benefits plans and medical claims
    are a different domain from property, casualty and life."
  - "Policyholders are not published as a concept: counting only `insureds` and
    `policyholders` (`members` and `customers` were workspace members and agency CRM
    records), 2 providers expose them."
  - "`plans` is not an insurance product here: reviewed, it was health, retirement and benefits
    plans."
  - "A claim needs no policy in the same API: claims and FNOL platforms expose claims alone."
  - "Duplicates merged: Audatex into Solera, Oper, Orbii, Thatch."
